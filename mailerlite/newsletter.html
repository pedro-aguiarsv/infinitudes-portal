<!--
  ============================================================================
  (IN)finitudes — Newsletter (campanha regular + bloco RSS) · plano gratuito
  ============================================================================

  IDEIA
  -----
  Campanha regular (grátis) com um BLOCO RSS que puxa sozinho os últimos
  posts do feed do site. Você salva como template e, a cada semana com
  novidade, cria a campanha a partir dele e clica enviar — o bloco já vem
  atualizado com o que estiver no feed naquele momento.

  MONTAGEM (uma vez)
  ------------------
  1) Campaigns → Create campaign → tipo "Regular campaign".
  2) Assunto: ex. "Novidades do (IN)finitudes" · Remetente: (IN)finitudes.
  3) Editor "Drag & drop". Monte 3 blocos, nesta ordem:

     [1] CABEÇALHO → adicione um bloco "HTML" e cole a parte [1] deste arquivo.

     [2] BLOCO RSS → na aba de blocos, seção "Blog and RSS", arraste um bloco
         RSS e configure:
           • RSS feed URL ...... https://infinitudes.com.br/rss.xml
           • Nº de posts ....... 1 a 3
           • Exibir ............ título + imagem + resumo
           • Cor do título .... #B8252B   | Fonte: Playfair Display (ou serifada)
           • Cor do resumo .... #2B2B2B   | Fonte: Inter (ou sans-serif)
           • Botão "Ler / Ouvir": fundo #B8252B | texto #FAF5E8
           • Cor de fundo do bloco .... #FAF5E8

     [3] RODAPÉ → adicione outro bloco "HTML" e cole a parte [3] deste arquivo.

  4) Salve como TEMPLATE. Selecione o grupo de inscritos.

  ENVIO SEMANAL
  -------------
  • Toda semana com material novo: Create campaign → a partir do template →
    o bloco RSS se atualiza sozinho → revise → envie.
  • Sem novidade na semana? Não envie (a campanha regular não "pula" sozinha
    e repetiria os mesmos posts).

  Obs.: no plano gratuito o logo do MailerLite aparece no rodapé do e-mail.
  ============================================================================
-->

<!-- =========================================================================
     [1] CABEÇALHO  → colar num bloco "HTML" no TOPO do e-mail
     ========================================================================= -->

  <tr>
    <td align="center" style="padding:36px 40px 8px 40px;">
      <a href="https://infinitudes.com.br" target="_blank" style="text-decoration:none;">
        <img src="https://infinitudes.com.br/logo/logo-header.png"
             alt="(IN)finitudes" width="220"
             style="display:block; width:220px; max-width:70%; height:auto; border:0;" />
      </a>
    </td>
  </tr>
  <tr>
    <td align="center" style="padding:0 40px 6px 40px;">
      <div style="height:1px; width:56px; background-color:#b8252b; margin:16px auto 0 auto;"></div>
    </td>
  </tr>
  <tr>
    <td align="center" style="padding:14px 48px 24px 48px; font-family:'Inter',Arial,Helvetica,sans-serif;">
      <p style="margin:0; font-size:13px; line-height:20px; letter-spacing:0.06em; text-transform:uppercase; color:#6b6558;">
        Novo no (IN)finitudes
      </p>
      <p style="margin:10px 0 0 0; font-size:15px; line-height:24px; color:#2b2b2b;">
        Um instante do seu dia para literatura, empatia e as muitas dimensões da vida.
      </p>
    </td>
  </tr>
</table>
